[package]
name = "lisek-tv"
description = "TV schedule engine: turns a channel's schedule into a timeline (pure, no IO)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
utoipa = { version = "5.5", features = ["uuid", "chrono"] }

[dev-dependencies]
serde_json = "1.0.151"
