[package]
name = "lisek-server"
description = "Main binary: Axum routing, middleware, startup."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lisek-core = { path = "../lisek-core" }
lisek-db = { path = "../lisek-db" }
lisek-auth = { path = "../lisek-auth" }
lisek-library = { path = "../lisek-library" }
lisek-metadata = { path = "../lisek-metadata" }
lisek-playback = { path = "../lisek-playback" }
lisek-telemetry = { path = "../lisek-telemetry" }
lisek-notifications = { path = "../lisek-notifications" }
lisek-games = { path = "../lisek-games" }
lisek-plugin-api = { path = "../lisek-plugin-api" }
# Faza 7 provider extensions — separate repos/crates per the project's
# directory layout, compiled in as ordinary Cargo path dependencies (see
# lisek-plugin-api's doc comment for why: no safe dynamic .dll/.so loading
# in Rust). Only provider_registry.rs ever names these two crates directly
# — that's the "one line" a new extension adds.
lisek-plugin-tmdb = { path = "../../../LisekMovie-plugin-tmdb" }
lisek-plugin-thetvdb = { path = "../../../LisekMovie-plugin-thetvdb" }
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
uuid = { version = "1.26.0", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["cors"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = "0.13.4"
tokio-util = { version = "0.7", features = ["io"] }
utoipa = { version = "5.5", features = ["uuid", "chrono"] }
