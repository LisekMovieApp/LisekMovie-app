[package]
name = "lisek-server"
description = "Main binary: Axum routing, middleware, startup."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lisek-core = { path = "../lisek-core" }
lisek-db = { path = "../lisek-db" }
lisek-auth = { path = "../lisek-auth" }
lisek-library = { path = "../lisek-library" }
lisek-metadata = { path = "../lisek-metadata" }
lisek-playback = { path = "../lisek-playback" }
lisek-telemetry = { path = "../lisek-telemetry" }
lisek-notifications = { path = "../lisek-notifications" }
lisek-games = { path = "../lisek-games" }
lisek-plugin-api = { path = "../lisek-plugin-api" }
# Provider extensions — separate repos/crates next to LisekMovie-app,
# compiled in as ordinary Cargo path dependencies (see lisek-plugin-api's
# doc comment for why: no safe dynamic .dll/.so loading in Rust). Paths
# live in the workspace's [workspace.dependencies]; only
# provider_registry.rs ever names these crates directly.
lisek-plugin-tmdb = { workspace = true }
lisek-plugin-thetvdb = { workspace = true }
lisek-plugin-imdb = { workspace = true }
lisek-plugin-omdb = { workspace = true }
lisek-plugin-anidb = { workspace = true }
lisek-plugin-anilist = { workspace = true }
lisek-plugin-anisearch = { workspace = true }
lisek-plugin-imvdb = { workspace = true }
lisek-plugin-vgmdb = { workspace = true }
lisek-plugin-audiodb = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Daily log files under <config>/logs (Faza 17), written off the request path.
tracing-appender = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
uuid = { version = "1.26.0", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["cors"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = "0.13.4"
tokio-util = { version = "0.7", features = ["io"] }
utoipa = { version = "5.5", features = ["uuid", "chrono"] }
utoipa-axum = "0.2"
arc-swap = "1"
# Avatar uploads (Faza 19): decode JPEG/PNG/WebP/GIF, resize, encode JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Database-backed enrichment tests (opt-in, LISEK_TEST_DATABASE_URL).
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
