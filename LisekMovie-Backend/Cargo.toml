[workspace]
resolver = "2"
members = [
    "lisek-server",
    "lisek-core",
    "lisek-db",
    "lisek-auth",
    "lisek-library",
    "lisek-metadata",
    "lisek-playback",
    "lisek-telemetry",
    "lisek-notifications",
    "lisek-games",
    "lisek-plugin-api",
]

# Shared metadata inherited by every crate via `field.workspace = true`.
# Keeps version/edition/license in one place instead of repeated 11 times.
[workspace.package]
version = "1.0.0-beta"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/LisekMovieApp/LisekMovie-app"
