<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Installable app (PWA): manifest, home-screen icons, full-screen
		     launch on Android and iOS. The status bar stays black above the
		     page, so nothing hides under it. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#000000" />
		<meta name="application-name" content="LisekMovie" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="LisekMovie" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="format-detection" content="telephone=no" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background:#000">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
