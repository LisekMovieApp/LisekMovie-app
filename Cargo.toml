[workspace]
resolver = "2"
members = [
    "apps/api/lisek-server",
    "apps/api/lisek-core",
    "apps/api/lisek-db",
    "apps/api/lisek-auth",
    "apps/api/lisek-library",
    "apps/api/lisek-metadata",
    "apps/api/lisek-playback",
    "apps/api/lisek-telemetry",
    "apps/api/lisek-notifications",
    "apps/api/lisek-games",
    "apps/api/lisek-plugin-api",
]

[workspace.metadata]
name = "lisek-api"

# Shared metadata inherited by every crate via `field.workspace = true`.
# Keeps version/edition/license in one place instead of repeated 11 times.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/LisekMovieApp/LisekMovie-app"
